services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    # The default DNS (host router) intermittently fails to resolve external
    # hosts like the Neon DB endpoint, hanging for ~30s before erroring.
    # Pin to reliable public resolvers to avoid that stall.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-neondb}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
